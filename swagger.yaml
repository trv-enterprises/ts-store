openapi: 3.0.3
info:
  title: ts-store API
  description: |
    Time series database API using a circular file architecture.

    ## Authentication

    ts-store uses two types of authentication:

    ### Admin Key (for store management)
    Required for creating new stores. Pass via:
    - Header: `X-Admin-Key: <admin-key>`
    - Query parameter: `?admin_key=<admin-key>`

    The admin key is configured at server startup (min 20 characters).

    ### Store API Key (for data operations)
    Required for all data operations on a store. Pass via (checked in order):
    - Header: `X-API-Key: tsstore_xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx`
    - Header: `Authorization: Bearer tsstore_xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx`
    - Query parameter: `?api_key=tsstore_xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx`

    Store API keys are generated when creating a store and shown only once.

    ## TLS/HTTPS
    The server supports optional TLS. When configured with certificate and key files,
    all HTTP endpoints use HTTPS and WebSocket endpoints use WSS.

    ## Timestamps
    All timestamps are Unix nanoseconds (int64). Timestamps must be strictly increasing - out-of-order timestamps will be rejected.

    ## Duration Format
    The `since` parameter accepts durations like: `30s`, `15m`, `2h`, `7d`, `1w`
  version: 0.6.8
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: TRV Enterprises LLC

servers:
  - url: http://localhost:21080
    description: Local development server (HTTP)
  - url: https://localhost:21080
    description: Local development server (HTTPS, if TLS configured)

tags:
  - name: Health
    description: Server health check
  - name: Stores
    description: Store management operations
  - name: Data
    description: Unified data operations (Content-Type determines format)
  - name: Schema
    description: Schema management for schema-type stores
  - name: WebSocket
    description: Outbound WebSocket connection management (data streaming)
  - name: Alerts
    description: Rule-based alerts with webhook, WS, or MQTT dispatch

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns server health status. No authentication required.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  time:
                    type: string
                    format: date-time
                    example: "2026-01-17T12:00:00Z"

  /api/stores:
    get:
      tags:
        - Stores
      summary: List stores
      description: |
        Returns all stores with their data type and rollup role.

        **Breaking change (v0.8.0):** `stores` is now an array of objects
        (`{name, data_type, role, ...}`); earlier versions returned an array of
        name strings.
      responses:
        '200':
          description: List of stores
          content:
            application/json:
              schema:
                type: object
                properties:
                  stores:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        data_type:
                          type: string
                          enum: [binary, text, json, schema]
                        role:
                          type: string
                          enum: [store, source, rollup]
                          description: "rollup = a rollup target; source = has rollups; store = neither"
                        rollup_of:
                          type: string
                          description: Source store name (when role=rollup)
                        window:
                          type: string
                          description: Rollup window (when role=rollup)
                    example:
                      - name: sensors
                        data_type: schema
                        role: source
                      - name: sensors-1h
                        data_type: schema
                        role: rollup
                        rollup_of: sensors
                        window: 1h

    post:
      tags:
        - Stores
      summary: Create a new store
      description: |
        Creates a new store and returns the API key.
        **Important:** The API key is shown only once. Save it securely.

        Requires admin authentication via `X-Admin-Key` header or `admin_key` query parameter.
      security:
        - AdminKeyHeader: []
        - AdminKeyQuery: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreRequest'
      responses:
        '201':
          description: Store created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStoreResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: admin key required
        '409':
          description: Store already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stores/{store}:
    delete:
      tags:
        - Stores
      summary: Delete a store
      description: Permanently deletes a store and all its data.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
      responses:
        '200':
          description: Store deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: store deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stores/{store}/reset:
    post:
      tags:
        - Stores
      summary: Reset store (soft reset)
      description: |
        Performs a soft reset of the store - clears all data but keeps configuration, schema, and API keys.
        Use this to start fresh without recreating the store.

        **Note:** This is a soft reset. Old data remains on disk until overwritten by new data.
        The reset operation is O(1) and completes instantly regardless of store size.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
      responses:
        '200':
          description: Store reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: store reset
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stores/{store}/stats:
    get:
      tags:
        - Stores
      summary: Get store statistics
      description: |
        Returns operational stats about the store: block counts, time
        range, partition layout, block size. **Unauthenticated** —
        deliberately public so dashboards and monitors can poll without
        a per-store API key. No store data is exposed.
      parameters:
        - $ref: '#/components/parameters/StoreName'
      responses:
        '200':
          description: Store statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreStats'

  /api/stores/{store}/metrics:
    get:
      tags:
        - Stores
      summary: Get store activity counters
      description: |
        Returns activity counters since process start (or the last
        reset): writes, reads, bytes, rule evaluations, rule matches,
        alert dispatches, alert drops. **Unauthenticated** — same
        posture as /stats. No record data is exposed.
      parameters:
        - $ref: '#/components/parameters/StoreName'
      responses:
        '200':
          description: Activity snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreActivity'

  /api/stores/{store}/metrics/reset:
    post:
      tags:
        - Stores
      summary: Reset activity counters
      description: |
        Zeros every counter on the store and on each alert worker, and
        advances the `since` timestamp to now. Authenticated because
        it changes server-visible state.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
      responses:
        '200':
          description: Counters reset
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/stores/{store}/data:
    post:
      tags:
        - Data
      summary: Insert data
      description: |
        Insert data with optional timestamp. Content-Type header determines format:
        - `application/json`: JSON body with `{"timestamp": ..., "data": ...}` wrapper
        - `application/octet-stream`: Raw binary body (timestamp auto-generated)
        - `text/plain`: Raw text body (timestamp auto-generated)

        For schema-type stores, data is validated against the schema and stored compactly.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertJSONRequest'
          application/octet-stream:
            schema:
              type: string
              format: binary
          text/plain:
            schema:
              type: string
      responses:
        '201':
          description: Data inserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertResponse'
        '400':
          description: Invalid request, data type mismatch, or out-of-order timestamp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stores/{store}/data/time/{timestamp}:
    get:
      tags:
        - Data
      summary: Get data by timestamp
      description: Retrieve data by its exact timestamp.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/SchemaVersionView'
      responses:
        '200':
          description: Data found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Data
      summary: Delete data by timestamp
      description: |
        Soft delete - excludes data from API responses and WebSocket streams.
        The data remains on disk until the block is overwritten as the circular buffer wraps.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
        - $ref: '#/components/parameters/Timestamp'
      responses:
        '200':
          description: Data deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: object deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stores/{store}/data/range:
    get:
      tags:
        - Data
      summary: Query data in time range
      description: |
        Retrieve data within a time range. Use either:
        - `since` parameter for relative time (e.g., `since=2h`)
        - `start_time` and `end_time` for absolute timestamps
        - `after` parameter for cursor-based pagination

        **Aggregation:** Add `agg_window` to aggregate data into time windows.
        Only supported for JSON and schema stores.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
        - $ref: '#/components/parameters/Limit100'
        - $ref: '#/components/parameters/Since'
        - name: start_time
          in: query
          schema:
            type: integer
            format: int64
          description: Start timestamp (Unix nanoseconds). Required if `since` not provided.
        - name: end_time
          in: query
          schema:
            type: integer
            format: int64
          description: End timestamp (Unix nanoseconds). Required if `since` not provided.
        - name: after
          in: query
          schema:
            type: integer
            format: int64
          description: Cursor-based pagination - return records after this timestamp.
        - $ref: '#/components/parameters/IncludeData'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/FilterIgnoreCase'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/SchemaVersionView'
        - $ref: '#/components/parameters/AggWindow'
        - $ref: '#/components/parameters/AggFields'
        - $ref: '#/components/parameters/AggDefault'
      responses:
        '200':
          description: Data in range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataListResponse'
        '400':
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/stores/{store}/data/oldest:
    get:
      tags:
        - Data
      summary: List oldest data objects
      description: Returns the N oldest data objects with data. Use `include_data=false` to return metadata only.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IncludeData'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/FilterIgnoreCase'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/SchemaVersionView'
      responses:
        '200':
          description: List of data objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/stores/{store}/data/newest:
    get:
      tags:
        - Data
      summary: List newest data objects
      description: |
        Returns the N newest data objects with data. Supports relative time queries with `since` parameter.
        Use `include_data=false` to return metadata only.

        **Aggregation:** Add `agg_window` to aggregate data into time windows.
        Only supported for JSON and schema stores.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/IncludeData'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/FilterIgnoreCase'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/SchemaVersionView'
        - $ref: '#/components/parameters/AggWindow'
        - $ref: '#/components/parameters/AggFields'
        - $ref: '#/components/parameters/AggDefault'
      responses:
        '200':
          description: List of data objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataListResponse'
        '400':
          description: Invalid since duration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/stores/{store}/schema:
    get:
      tags:
        - Schema
      summary: Get schema
      description: Returns the current schema for schema-type stores, or a specific historical version when the `version` query parameter is supplied.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
        - name: version
          in: query
          required: false
          description: Return this specific schema version instead of the current one.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Schema found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
        '400':
          description: Store is not a schema-type store, or invalid version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No schema defined, or requested version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Schema
      summary: Set or update schema
      description: |
        Sets or updates the schema for schema-type stores.
        For updates, the new schema must be append-only compatible (existing fields cannot be modified or removed).
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaRequest'
            example:
              fields:
                - index: 1
                  name: temperature
                  type: float32
                - index: 2
                  name: humidity
                  type: float32
      responses:
        '200':
          description: Schema updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: schema updated
                  version:
                    type: integer
                    example: 1
        '400':
          description: Invalid schema or not a schema-type store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/stores/{store}/schema/versions:
    get:
      tags:
        - Schema
      summary: List all schema versions
      description: Returns every schema version for a schema-type store, in ascending order.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
      responses:
        '200':
          description: Schema versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_version:
                    type: integer
                    example: 2
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SchemaResponse'
        '400':
          description: Store is not a schema-type store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No schema defined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stores/{store}/ws/connections:
    get:
      tags:
        - WebSocket
      summary: List WebSocket connections
      description: Returns all outbound WebSocket connections for the store.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
      responses:
        '200':
          description: List of connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/WSConnectionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - WebSocket
      summary: Create WebSocket connection
      description: |
        Create an outbound WebSocket connection. ts-store will dial the specified URL
        and push data (push mode) or receive data (pull mode).

        For rule-based notifications, use the `/alerts/*` endpoints — WS push
        is now a data-streaming resource only.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWSConnectionRequest'
      responses:
        '201':
          description: Connection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WSConnectionStatus'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/stores/{store}/ws/connections/{connId}:
    get:
      tags:
        - WebSocket
      summary: Get connection status
      description: Returns detailed status of a WebSocket connection.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: Connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WSConnectionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - WebSocket
      summary: Delete connection
      description: Stop and remove a WebSocket connection.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: Connection deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: connection deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stores/{store}/alerts:
    get:
      tags:
        - Alerts
      summary: List all alerts for a store
      description: |
        Returns the status of every alert across all three transports
        (webhook, ws, mqtt). Each entry is tagged with its `type`.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
      responses:
        '200':
          description: List of alert statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertStatus'
    post:
      tags:
        - Alerts
      summary: Create an alert
      description: |
        Creates a webhook, WebSocket, or MQTT alert. The request body's
        `type` field discriminates: it must be `"webhook"`, `"ws"`, or
        `"mqtt"`, and exactly one matching nested options object
        (`webhook`, `ws`, or `mqtt`) must be provided.

        Each alert carries exactly one rule (the `name`, `condition`,
        `cooldown`, `external_ref`, `restart_policy`, `max_replay`
        fields at the top level of the request).
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRequest'
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertStatus'
        '400':
          description: |
            Invalid request — missing/unknown `type`, missing matching
            options block, validation failure on rule fields, etc.

  /api/stores/{store}/alerts/{alertId}:
    get:
      tags:
        - Alerts
      summary: Get alert detail
      description: |
        Returns the alert's worker runtime status plus its persisted
        configuration (rule fields, URL/broker/topic, headers, etc.).
        The response is a flat object: top-level fields are the
        runtime Status and the rule fields (AlertCommon); the matching
        transport config sits under one of `webhook`, `ws`, or `mqtt`
        (only one will be present).

        Sensitive fields are redacted on read: MQTT `password` and
        well-known auth-style HTTP headers (`Authorization`,
        `X-API-Key`, `X-Auth-Token`, `X-Access-Token`,
        `Proxy-Authorization`, `Cookie`) come back as `[redacted]`.
        The values on disk are unchanged.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
        - name: alertId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alert detail (status + config)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Alerts
      summary: Delete an alert
      description: Stop the worker and remove the persisted configuration.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
        - name: alertId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alert deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/stores/{store}/rollups:
    get:
      tags:
        - Rollups
      summary: List rollups
      description: Lists rollups whose source is this store.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
      responses:
        '200':
          description: List of rollups
          content:
            application/json:
              schema:
                type: object
                properties:
                  rollups:
                    type: array
                    items:
                      $ref: '#/components/schemas/RollupStatus'
    post:
      tags:
        - Rollups
      summary: Create a rollup
      description: |
        Creates a rollup that aggregates this (source) store into clock-aligned
        windows and writes one record per closed window into a target store. The
        target schema store is auto-created and sized from `retention` if it
        doesn't exist, and its API keys are linked to this source.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRollupRequest'
            example:
              window: 1h
              agg_fields: cpu:avg+max,mem:avg
              retention: 1y
      responses:
        '201':
          description: Rollup created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollupStatus'
        '400':
          description: Invalid request (bad window/agg spec, or target conflict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/stores/{store}/rollups/{rollupId}:
    get:
      tags:
        - Rollups
      summary: Get a rollup
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
        - name: rollupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rollup status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RollupStatus'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Rollups
      summary: Delete a rollup
      description: Stops the worker and removes the rollup config. The target store is left intact.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
        - ApiKeyQuery: []
      parameters:
        - $ref: '#/components/parameters/StoreName'
        - name: rollupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rollup deleted
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key in X-API-Key header
    BearerAuth:
      type: http
      scheme: bearer
      description: API key in Authorization Bearer header
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: API key in query parameter
    AdminKeyHeader:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: Admin key for store management operations
    AdminKeyQuery:
      type: apiKey
      in: query
      name: admin_key
      description: Admin key in query parameter

  parameters:
    StoreName:
      name: store
      in: path
      required: true
      schema:
        type: string
      description: Store name
      example: my-store

    Timestamp:
      name: timestamp
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Unix timestamp in nanoseconds
      example: 1704067200000000000

    ConnectionId:
      name: connId
      in: path
      required: true
      schema:
        type: string
      description: WebSocket connection ID
      example: abc123

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
      description: Maximum number of results to return

    Limit100:
      name: limit
      in: query
      schema:
        type: integer
        default: 100
        minimum: 1
      description: Maximum number of results to return

    Since:
      name: since
      in: query
      schema:
        type: string
      description: Relative time duration (e.g., 30s, 15m, 2h, 7d, 1w)
      example: 2h

    IncludeData:
      name: include_data
      in: query
      schema:
        type: boolean
        default: true
      description: Include the actual data content in the response (set to false to return metadata only)

    Filter:
      name: filter
      in: query
      schema:
        type: string
      description: Text filter - only return objects containing this string

    FilterIgnoreCase:
      name: filter_ignore_case
      in: query
      schema:
        type: boolean
        default: false
      description: Make text filter case-insensitive

    Format:
      name: format
      in: query
      schema:
        type: string
        enum: [compact, expanded]
        default: expanded
      description: For schema stores, 'compact' returns numeric field indices, 'expanded' returns field names

    SchemaVersionView:
      name: schema_version
      in: query
      schema:
        type: string
        default: wide
      description: |
        For schema stores, selects the read-time expansion view:
        - `wide` (default): wide union schema across all versions; fields a record lacks are returned as JSON null
        - `record`: expand each record against the version it was written under (missing fields absent, not null)
        - `<N>` (integer): expand every record through schema version N
        Ignored when `format=compact`. Does not affect aggregation queries.

    AggWindow:
      name: agg_window
      in: query
      schema:
        type: string
      description: |
        Aggregation window duration (e.g., 30s, 1m, 5m, 1h). When set, records are
        aggregated into time windows. Only supported for JSON and schema stores.
      example: 1m

    AggFields:
      name: agg_fields
      in: query
      schema:
        type: string
      description: |
        Per-field aggregation functions as comma-separated field:function pairs.
        Valid functions: sum, avg, max, min, count, last.
      example: "cpu.pct:avg,memory.used:max"

    AggDefault:
      name: agg_default
      in: query
      schema:
        type: string
        enum: [sum, avg, max, min, count, last]
      description: Default aggregation function for numeric fields not listed in agg_fields. Non-numeric fields always use 'last'.
      example: avg

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: error message

    CreateStoreRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Store name
          example: my-store
        num_blocks:
          type: integer
          default: 1024
          description: Number of blocks
        data_block_size:
          type: integer
          default: 4096
          description: Data block size in bytes (must be power of 2)
        index_block_size:
          type: integer
          default: 4096
          description: Index block size in bytes (must be power of 2)

    CreateStoreResponse:
      type: object
      properties:
        name:
          type: string
          example: my-store
        api_key:
          type: string
          description: API key (shown only once)
          example: tsstore_a1b2c3d4-e5f6-7890-abcd-ef1234567890
        key_id:
          type: string
          description: Key ID for reference
          example: a1b2c3d4

    StoreActivity:
      type: object
      description: |
        Activity counters for a store: I/O on the store itself plus
        rule/alert counters summed from every alert worker.
      properties:
        store:
          type: object
          properties:
            writes:
              type: integer
              format: int64
              description: Successful PutObject calls since the counters last reset.
            bytes_written:
              type: integer
              format: int64
            reads:
              type: integer
              format: int64
              description: |
                Sum of GetObject, GetObjectByTime, and range-scan calls
                (GetObjectsInRange / GetOldestObjects / GetNewestObjects).
                Range scans count once per call regardless of how many
                handles they return.
            bytes_read:
              type: integer
              format: int64
              description: |
                Bytes of object payload returned to callers via GetObject
                and GetObjectByTime. Range scans return handles only and
                do not credit byte counts here.
            since:
              type: string
              format: date-time
              description: When the counters last started accumulating.
        alerts:
          type: array
          description: One entry per active alert worker on the store.
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
                enum: [webhook, ws, mqtt]
              rules_tested:
                type: integer
                format: int64
              rules_matched:
                type: integer
                format: int64
              alerts_fired:
                type: integer
                format: int64
              alerts_dropped:
                type: integer
                format: int64
                description: |
                  Sink.Send returned an error — for webhook sinks this
                  includes the async queue overflow path.

    StoreStats:
      type: object
      properties:
        num_blocks:
          type: integer
          format: uint32
          example: 1024
        data_block_size:
          type: integer
          format: uint32
          example: 4096
        index_block_size:
          type: integer
          format: uint32
          example: 4096
        head_block:
          type: integer
          format: uint32
          example: 50
        tail_block:
          type: integer
          format: uint32
          example: 0
        free_list_count:
          type: integer
          format: uint32
          example: 0
        write_offset:
          type: integer
          format: uint32
          example: 128
        active_blocks:
          type: integer
          format: uint32
          example: 51
        oldest_timestamp:
          type: integer
          format: int64
          example: 1704067200000000000
        oldest_time:
          type: string
          example: "2024-01-01T00:00:00Z"
        newest_timestamp:
          type: integer
          format: int64
          example: 1704153600000000000
        newest_time:
          type: string
          example: "2024-01-02T00:00:00Z"

    InsertJSONRequest:
      type: object
      required:
        - data
      properties:
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp in nanoseconds (optional, defaults to now)
        data:
          description: JSON data to store
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean

    InsertResponse:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
          example: 1704067200000000000
        block_num:
          type: integer
          format: uint32
          example: 5
        size:
          type: integer
          format: uint32
          example: 64

    DataResponse:
      type: object
      description: A data object with optional data content
      properties:
        timestamp:
          type: integer
          format: int64
          example: 1704067200000000000
        block_num:
          type: integer
          format: uint32
          example: 5
        size:
          type: integer
          format: uint32
          example: 64
        schema_version:
          type: integer
          format: uint32
          description: For schema stores, the schema version this record was written under (omitted for non-schema stores).
          example: 1
        data:
          description: |
            Data content (omitted if include_data=false).
            Format depends on store type:
            - binary: base64-encoded string
            - text: UTF-8 string
            - json: JSON object
            - schema: JSON object with field names (or numeric indices if format=compact)
          oneOf:
            - type: string
            - type: object

    DataListResponse:
      type: object
      properties:
        objects:
          type: array
          items:
            $ref: '#/components/schemas/DataResponse'
        count:
          type: integer
          example: 10
        rollup:
          type: object
          description: Present only when the store is a rollup target. Lets a consumer learn the window in the same call as the data.
          properties:
            role:
              type: string
              example: rollup
            window:
              type: string
              example: 1h
            rollup_of:
              type: string
              example: sensors

    CreateRollupRequest:
      type: object
      required:
        - window
      properties:
        name:
          type: string
        target_store:
          type: string
          description: Target store name. Defaults to "<source>-<canonical-window>".
        window:
          type: string
          description: Aggregation window (1m, 1h, 1d, ...)
          example: 1h
        agg_fields:
          type: string
          description: Per-field aggregation, e.g. "cpu:avg+max,mem:avg"
        agg_default:
          type: string
          description: Default aggregation function for numeric fields not listed.
        poll_interval:
          type: string
          example: 30s
        restart_policy:
          type: string
          enum: [resume, now]
        retention:
          type: string
          description: How long the target keeps rows; sizes the target store.
          example: 1y
        edge_tolerance:
          type: number
          format: float
          description: Max over-retention fraction; chooses partition count. Default 0.10.
        force_recreate:
          type: boolean
          description: Flush/recreate the target to apply changed window/agg/retention params.

    RollupStatus:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        source_store:
          type: string
        target_store:
          type: string
        window:
          type: string
          example: 1h
        state:
          type: string
          enum: [running, stopped, error]
        last_window_end:
          type: integer
          format: int64
        windows_written:
          type: integer
          format: int64
        last_error:
          type: string
        created_at:
          type: string
          format: date-time

    SchemaField:
      type: object
      required:
        - index
        - name
        - type
      properties:
        index:
          type: integer
          minimum: 1
          description: Field index (1-based, used in compact storage format)
          example: 1
        name:
          type: string
          description: Field name
          example: temperature
        type:
          type: string
          enum: [int8, int16, int32, int64, uint8, uint16, uint32, uint64, float32, float64, bool, string]
          description: Field data type
          example: float32

    SchemaRequest:
      type: object
      required:
        - fields
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SchemaField'
          description: Schema fields

    SchemaResponse:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
          description: Schema version number
          example: 1
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SchemaField'
          description: Schema fields

    CreateWSConnectionRequest:
      type: object
      required:
        - mode
        - url
      properties:
        mode:
          type: string
          enum: [push, pull]
          description: Connection mode - push (send data) or pull (receive data)
        url:
          type: string
          description: WebSocket URL to connect to
          example: ws://remote-server:8080/data
        from:
          type: integer
          format: int64
          description: Start timestamp for push mode (0 = from beginning)
          default: 0
        format:
          type: string
          enum: [compact, full]
          default: full
          description: Data format for schema stores
        headers:
          type: object
          additionalProperties:
            type: string
          description: Custom HTTP headers for WebSocket handshake
        filter:
          type: string
          description: Substring filter - only send matching records
        filter_ignore_case:
          type: boolean
          default: false
          description: Case-insensitive filter matching
        agg_window:
          type: string
          description: Aggregation window (e.g., "1m", "5m", "1h")
        agg_fields:
          type: string
          description: Per-field aggregation functions (e.g., "temp:avg,count:sum")
        agg_default:
          type: string
          description: Default aggregation function(s) (e.g., "avg" or "avg,sum,min,max")

    AlertCommon:
      type: object
      required:
        - name
        - condition
      description: |
        The rule + dispatch policy fields shared by every alert transport
        (webhook, ws, mqtt). Embedded at the top level of CreateAlertRequest
        and surfaced on AlertDetail. Field names in the `condition` may
        include dots and hyphens (e.g. `cpu.percent`, `temp.cpu_c`).
      properties:
        name:
          type: string
          description: Human label for this alert, echoed on every fire.
          example: high_temp
        condition:
          type: string
          description: |
            Condition expression. Syntax:
            - Simple: "temperature > 80", "status == \"error\""
            - Compound: "temp > 80 AND humidity < 30", "level == \"warn\" OR level == \"error\""
          example: temperature > 80
        cooldown:
          type: string
          description: Minimum time between fires (e.g., "5m", "1h").
          example: 5m
        external_ref:
          type: string
          maxLength: 512
          description: |
            Opaque pass-through string echoed verbatim on every alert
            payload this alert fires. ts-store does not parse or interpret
            it. Cap is 512 bytes; NUL bytes are rejected. Use for a
            dashboard component id, a Grafana slug, or a JSON-encoded
            compound key.
          example: dashboards/warehouse-sensors#component-42
        restart_policy:
          type: string
          enum: ["", "now", "resume"]
          description: |
            How the worker resumes after a process restart.
            - "" or "now" (default): start from wall-clock now; the
              worker does not consult or write a cursor. Best for
              high-frequency metric streams where a brief gap is OK.
            - "resume": read the persisted cursor on Start and replay
              records since lastTs. If `max_replay` is set, the resume
              window is bounded to `now - max_replay`. Best for event
              streams (e.g. journal logs) where a missed match matters.
        max_replay:
          type: string
          description: |
            Duration cap on the resume replay window. Only valid when
            `restart_policy="resume"`. Empty means unbounded.
          example: 1h

    AlertStatus:
      type: object
      description: |
        Runtime status of a single alert worker. Each alert has exactly
        one rule, so `rule_name` is a single string (not an array).
      properties:
        id:
          type: string
          example: a1b2c3d4
        type:
          type: string
          enum: [webhook, ws, mqtt]
        target:
          type: string
          description: URL (webhook/ws) or "broker -> topic" (mqtt).
        rule_name:
          type: string
          description: The single rule's name, mirrored here for status output.
        alerts_fired:
          type: integer
          format: int64
        last_timestamp:
          type: integer
          format: int64
        state:
          type: string
          enum: [running, stopped, error]
        last_error:
          type: string
        created_at:
          type: string
          format: date-time

    AlertDetail:
      description: |
        Flattened view of an alert's worker status plus its persisted
        configuration. Status fields and the rule fields (AlertCommon)
        appear at the top level; the transport-specific config is
        nested under `webhook`, `ws`, or `mqtt` — exactly one will be
        present, matching `type`. Sensitive values (MQTT password,
        common auth-style headers) are redacted as `[redacted]`.
      allOf:
        - $ref: '#/components/schemas/AlertStatus'
        - $ref: '#/components/schemas/AlertCommon'
        - type: object
          properties:
            poll_interval:
              type: string
              description: Worker poll cadence.
              example: 1s
            webhook:
              description: Present when type is "webhook".
              type: object
              properties:
                url:
                  type: string
                headers:
                  type: object
                  additionalProperties: { type: string }
                timeout:
                  type: string
            ws:
              description: Present when type is "ws".
              type: object
              properties:
                url:
                  type: string
                headers:
                  type: object
                  additionalProperties: { type: string }
            mqtt:
              description: Present when type is "mqtt".
              type: object
              properties:
                broker_url:
                  type: string
                topic:
                  type: string
                username:
                  type: string
                password:
                  type: string
                  description: Redacted to "[redacted]" if set on disk.
                qos:
                  type: integer
                  enum: [0, 1, 2]

    WebhookOptions:
      type: object
      required:
        - url
      description: Transport options for a webhook alert.
      properties:
        url:
          type: string
          example: https://hooks.example.com/incoming
        headers:
          type: object
          additionalProperties:
            type: string
          description: Custom HTTP headers (e.g., Authorization).
        timeout:
          type: string
          description: HTTP timeout per request (default 10s).
          example: 10s

    WSAlertOptions:
      type: object
      required:
        - url
      description: |
        Transport options for a WebSocket alert. Each fire opens a
        fresh outbound WS connection, writes one
        `{"type":"alert","alert":{...}}` frame, and closes.
      properties:
        url:
          type: string
          example: wss://alerts.example.com/in
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers sent on the WebSocket upgrade request.

    MQTTAlertOptions:
      type: object
      required:
        - broker_url
        - topic
      description: |
        Transport options for an MQTT alert. The worker holds a
        persistent client and publishes the alert payload to `topic`.
      properties:
        broker_url:
          type: string
          example: tcp://broker.example.com:1883
        topic:
          type: string
          example: alerts/heat
        username:
          type: string
        password:
          type: string
        qos:
          type: integer
          enum: [0, 1, 2]
          default: 1
          description: MQTT QoS. Defaults to 1 (at-least-once) when 0 or omitted.

    CreateAlertRequest:
      description: |
        Unified create request for `POST /api/stores/{store}/alerts`.

        The `type` field discriminates the transport. Exactly one of
        `webhook`, `ws`, or `mqtt` must be present and must agree with
        `type`. The remaining fields (from AlertCommon) configure the
        single rule attached to this alert.
      allOf:
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum: [webhook, ws, mqtt]
              description: Transport discriminator.
            poll_interval:
              type: string
              description: How often the worker polls the store (default 1s).
              example: 1s
        - $ref: '#/components/schemas/AlertCommon'
        - type: object
          properties:
            webhook:
              $ref: '#/components/schemas/WebhookOptions'
            ws:
              $ref: '#/components/schemas/WSAlertOptions'
            mqtt:
              $ref: '#/components/schemas/MQTTAlertOptions'

    WSConnectionStatus:
      type: object
      properties:
        id:
          type: string
          example: abc123
        mode:
          type: string
          enum: [push, pull]
        url:
          type: string
          example: ws://remote-server:8080/data
        status:
          type: string
          enum: [connecting, connected, disconnected, error]
        created_at:
          type: string
          format: date-time
        last_timestamp:
          type: integer
          format: int64
          description: Last processed timestamp
        messages_sent:
          type: integer
          format: int64
        messages_received:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        last_error:
          type: string

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: unauthorized

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not found
