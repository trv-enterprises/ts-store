#
# Build release binaries for linux/{amd64,arm64} on tag push and attach
# them to the corresponding GitHub Release (creating it if necessary).

name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  # Manual trigger lets us re-run the build for an existing tag if the
  # automatic run failed or was added after the tag was already pushed.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.6.0)'
        required: true
        type: string

permissions:
  contents: write # to upload assets / create releases

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: tag
        run: |
          # workflow_dispatch supplies the tag as an input; tag pushes use
          # github.ref_name directly.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Check out the tag we're building — for workflow_dispatch this
          # means the input tag, not the default branch.
          ref: ${{ steps.tag.outputs.name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build linux/amd64 and linux/arm64 via Makefile
        run: |
          # `make release-binaries` builds both architectures with the
          # version injected via -ldflags, then copies them into dist/
          # with the tag name in the filename.
          make release-binaries VERSION=${{ steps.tag.outputs.name }}

      # Guard for issue #182: the ldflag silently targeted a symbol that did
      # not exist, so the injected version was dropped and every rc binary
      # reported the previous release. Nothing caught it — the release path
      # verified nothing about what it produced, and the mismatch only
      # surfaced on a host during a canary. Assert it here instead.
      - name: Verify the built binary reports the tag
        run: |
          set -euo pipefail
          tag='${{ steps.tag.outputs.name }}'
          bin="dist/tsstore-${tag}-linux-amd64"
          got="$("$bin" version | awk '{print $2}')"
          if [ "$got" != "$tag" ]; then
            echo "::error::built binary reports '$got' but the tag is '$tag' — the version ldflag is not reaching internal/version.Version"
            exit 1
          fi
          echo "✓ binary reports $got"

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          # If the release exists (e.g. created earlier by `make release`),
          # the action appends these assets; otherwise it creates one with
          # the tag name as the title.
          #
          # Semver tags with a hyphen (v0.12.0-rc.1, v1.0.0-beta.2) are
          # prereleases: mark them so they don't show as "Latest" on the
          # releases page. Deploys are unaffected either way (they pin
          # exact tags), this is for people browsing the repo.
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: |
            dist/tsstore-${{ steps.tag.outputs.name }}-linux-amd64
            dist/tsstore-${{ steps.tag.outputs.name }}-linux-arm64
            dist/journal-logs-${{ steps.tag.outputs.name }}-linux-amd64
            dist/journal-logs-${{ steps.tag.outputs.name }}-linux-arm64
            dist/system-stats-${{ steps.tag.outputs.name }}-linux-amd64
            dist/system-stats-${{ steps.tag.outputs.name }}-linux-arm64
          fail_on_unmatched_files: true
